name: Deploying Portfolilo on Github Pages

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            pages: write
            id-token: write

        steps:
            - uses: actions/checkout@v6
            - uses: actions/upload-pages-artifact@v4
              with:
                path: .
            - uses: actions/deploy-pages@v4